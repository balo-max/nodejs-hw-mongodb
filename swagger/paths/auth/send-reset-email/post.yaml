tags:
  - Auth
summary: Send reset link to an email
operationId: sendResetLink
description: 'Send reset password link to an email'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            description: 'User email'
            type: string
            example: 'MaxDoe@gmail.com'
responses:
  '200':
    description: 'Send reset link to an email successfully'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email was successfully sent!
            data:
              type: object
  '404':
    $ref: ../../../components/responses/auth/404-2.yaml
  '500':
    $ref: ../../../components/responses/auth/send-reset-email/500-2.yaml
