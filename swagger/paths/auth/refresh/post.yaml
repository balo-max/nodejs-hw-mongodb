tags:
  - Auth
summary: Refresh user
operationId: refreshUser
description: 'Refresh user'
security:
  - bearerAuth: []
parameters:
  - in: cookie
    name: sessionId
    schema:
      type: string
    example: 'j%3A%22684d2831a07b6138cba4e9a3%22'
    required: true
  - in: cookie
    name: refreshToken
    schema:
      type: string
    example: 'DEBEiUSjKoV%2FXNv%2B97VnndxSrKBcmgV7Kc%2BfcksB'
    required: true
responses:
  '200':
    description: 'User session successfully refreshed'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              properties:
                accessToken:
                  description: Access Token
                  type: string
                  example: xep6jBmup7XcIzfqtr0X5ZIPTQnGTsetBTdqNX/E
  '401':
    $ref: ../../../components/responses/auth/refresh/401-3.yaml
  '404':
    $ref: ../../../components/responses/auth/refresh/404-3.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
