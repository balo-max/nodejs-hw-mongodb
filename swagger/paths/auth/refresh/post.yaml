tags:
  - Auth
summary: Refresh user
operationId: refreshUser
description: 'Refresh user'
security:
  - bearerAuth: []
responses:
  '200':
    description: 'Refreshed in an user'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              $ref: ../../../components/schemas/loginUser.yaml
  '401':
    $ref: ../../../components/responses/auth/refresh/401-3.yaml
  '404':
    $ref: ../../../components/responses/auth/refresh/404-3.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
