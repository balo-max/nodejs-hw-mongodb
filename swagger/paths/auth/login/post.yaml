tags:
  - Auth
summary: Login user
operationId: loginUser
description: 'Login user'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: 'User email'
            type: string
            example: 'MaxDoe@gmail.com'
          password:
            description: 'User password'
            type: string
            example: 'your_password_here'
responses:
  '200':
    description: 'Logged in an user'
    headers:
      Set-Cookie:
        description: HttpOnly cookies with sessionId and refreshToken
        schema:
          type: string
          example: |
            sessionId=abc123; HttpOnly;
            refreshToken=def456; HttpOnly;
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
            data:
              type: object
              properties:
                accessToken:
                  description: Access Token
                  type: string
                  example: xep6jBmup7XcIzfqtr0X5ZIPTQnGTsetBTdqNX/E
  '401':
    $ref: ../../../components/responses/auth/401-2.yaml
  '404':
    $ref: ../../../components/responses/auth/404-2.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
