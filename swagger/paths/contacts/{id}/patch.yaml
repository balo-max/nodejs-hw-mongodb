tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: 'Update contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '6839dc66812ffad184130baf'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Max Doe'
          phoneNumber:
            description: "Contact's phonenumber"
            type: string
            example: '+380501114455'
          email:
            description: "Contact's email"
            type: string
            example: 'MaxDoe@gmail.com'
          isFavourite:
            description: 'Whether is contact a favourite'
            type: boolean
            example: false
          contactType:
            description: "Contact's type"
            type: string
            enum: ['work', 'home', 'personal']
          photo:
            description: "Link to contact's photo"
            format: binary
            type: string
            example: https://res.cloudinary.com/dh0wcgrhc/image/upload/v1749148752/ktuoij9iktjyk7ibdnbm.jpg
responses:
  '200':
    description: 'Update contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '401':
    $ref: ../../../components/responses/contacts/401.yaml
  '404':
    $ref: ../../../components/responses/contacts/404.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
